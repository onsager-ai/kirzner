[package]
name = "kirzner"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A local-first business experiment workspace"
license = "MIT"

[dependencies]
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "migrate", "macros"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }

[dev-dependencies]
http-body-util = "=0.1.5"
tower = { version = "=0.5.3", features = ["util"] }
